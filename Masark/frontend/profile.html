<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/assets/js/device-boot.js"></script>
<title>مسارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/animations.css">
<style>
  .profile-head { display:flex; flex-direction:column; align-items:center; gap:var(--sp-3); text-align:center; padding: var(--sp-6) 0; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--gradient-brand); display:grid; place-items:center; color:#fff; font-size: 1.75rem; font-weight:800; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .settings-row { display:flex; align-items:center; justify-content:space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border-bottom:none; }
</style>
</head>
<body>
  <div class="app-shell">
    <nav class="tab-bar" id="tabBar"></nav>
    <main class="app-main page-enter">
      <div class="profile-head">
        <div class="avatar" id="avatar"></div>
        <div>
          <h2 id="profileName"></h2>
          <p class="text-small text-muted" id="profileEmail"></p>
        </div>
      </div>

      <div class="hero-panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span data-i18n="profile.overall_progress"></span>
          <strong id="overallPct">0%</strong>
        </div>
        <div class="bar-track" style="margin-top:10px"><div class="bar-fill" id="overallBar"></div></div>
      </div>

      <div class="card" id="settings" style="margin-top:var(--sp-5);scroll-margin-top:100px">
        <h3 data-i18n="profile.settings"></h3>
        <div class="settings-row">
          <span data-i18n="profile.dark_mode"></span>
          <label class="switch"><input type="checkbox" id="darkModeToggle"><span class="track"><span class="thumb"></span></span></label>
        </div>
        <div class="settings-row">
          <span data-i18n="profile.language"></span>
          <div class="chip-group">
            <button class="chip" data-lang="ar">عربي</button>
            <button class="chip" data-lang="en">English</button>
          </div>
        </div>
        <div class="settings-row">
          <span data-i18n="profile.device"></span>
          <div class="chip-group">
            <button class="chip" data-device="mobile" data-i18n="profile.device_mobile"></button>
            <button class="chip" data-device="desktop" data-i18n="profile.device_desktop"></button>
          </div>
        </div>
        <div class="settings-row">
          <span data-i18n="profile.edit"></span>
          <button class="btn btn-ghost btn-sm" id="editBtn">✎</button>
        </div>
      </div>

      <button class="btn btn-outline btn-block" id="logoutBtn" style="margin-top:var(--sp-5)" data-i18n="profile.logout"></button>
    </main>
  </div>
  <script type="module" src="/assets/js/page-profile.js"></script>
</body>
</html>
