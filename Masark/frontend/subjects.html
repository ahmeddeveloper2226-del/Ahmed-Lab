<body>
  <div class="app-shell">
    <nav class="tab-bar" id="tabBar"></nav>
    <main class="app-main">
      <header class="sj-head">
        <div>
          <h1 class="grad-text" data-i18n="subjects.title"></h1>
          <p class="text-muted" data-i18n="subjects.subtitle"></p>
        </div>
        <div class="sj-actions">
          <span class="sj-chip" id="subjectCount"></span>
          <button class="btn btn-primary" id="addSubjectBtn" data-i18n="subjects.add"></button>
        </div>
      </header>
      <div class="sj-grid" id="subjectGrid"></div>
    </main>
  </div>

  <!-- Subject detail sheet -->
  <div class="detail-sheet" id="detailSheet">
    <div class="ds-panel" id="dsPanel">
      <div class="ds-hero">
        <span class="ds-badge" id="dsBadge"></span>
        <div class="ds-titles">
          <h2 id="detailTitle"></h2>
          <p id="dsSub"></p>
        </div>
        <button class="btn btn-icon ds-close" id="closeDetailBtn" aria-label="close">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="detail-tabs" id="detailTabs"></div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <!-- Add-subject sheet -->
  <div class="sheet-backdrop" id="addSubjectSheet">
    <div class="sheet-panel"><div id="addSubjectContent"></div></div>
  </div>

  <script type="module" src="/assets/js/page-subjects.js"></script>
