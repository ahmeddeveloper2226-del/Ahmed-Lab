<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/assets/js/device-boot.js"></script>
<title>مسارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/animations.css">
<style>
  body { background: var(--gradient-hero); }
  .login-shell { min-height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; }
  .login-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-3); padding: var(--sp-6) var(--sp-4); }
  .login-card { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--sp-6) var(--sp-5) var(--sp-7); box-shadow: 0 -12px 40px rgba(11,32,39,0.12); }
  @media (min-width: 520px) { .login-card { max-width: 440px; margin-inline: auto; border-radius: var(--radius-lg); margin-bottom: var(--sp-6); } }
  .divider { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-5) 0; color: var(--text-muted); font-size: var(--fs-small); }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .lang-toggle { position: fixed; top: calc(var(--sp-4) + var(--safe-top)); inset-inline-end: var(--sp-4); z-index: 10; }
  .form-mode { display: none; } .form-mode.active { display: block; }
</style>
</head>
<body>
  <button class="btn btn-ghost btn-sm lang-toggle" id="langToggle">EN</button>

  <div class="login-shell">
    <div class="login-hero">
      <div class="wordmark" style="font-size:2.75rem" id="wordmarkIntro">مسارك</div>
      <p class="text-muted" style="text-align:center;max-width:320px" data-i18n="login.subtitle"></p>
    </div>

    <div class="login-card">
      <button class="btn btn-outline btn-block" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 4.9 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5Z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 4.9 29.5 3 24 3c-7.7 0-14.4 4.3-17.7 11.7Z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-1.8 14-4.9l-6.5-5.4C29.4 36.3 26.8 37 24 37c-5.3 0-9.7-3.5-11.2-8.3l-6.6 5.1C9.5 40.6 16.2 45 24 45Z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.7l6.5 5.4C41.3 36 45 30.6 45 24c0-1.4-.1-2.5-.4-3.5Z"/></svg>
        <span data-i18n="login.google"></span>
      </button>

      <div class="divider"><span>or</span></div>

      <div class="chip-group" style="margin-bottom:var(--sp-4)">
        <button class="chip selected" data-mode="signin" data-i18n="login.signin"></button>
        <button class="chip" data-mode="signup" data-i18n="login.signup"></button>
      </div>

      <form id="emailForm">
        <div class="field">
          <label data-i18n="login.email"></label>
          <input class="input" type="email" id="emailInput" required autocomplete="email">
        </div>
        <div class="field">
          <label data-i18n="login.password"></label>
          <input class="input" type="password" id="passwordInput" required minlength="6" autocomplete="current-password">
        </div>
        <p class="text-small" style="color:var(--status-bad);display:none" id="errorMsg"></p>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">
          <span id="submitLabel" data-i18n="login.signin"></span>
        </button>
      </form>

      <p class="text-small text-muted" style="text-align:center;margin-top:var(--sp-5)">
        <a href="/index.html" data-i18n="login.how_to_use" style="text-decoration:underline"></a>
      </p>
    </div>
  </div>

  <script type="module">
    import { initI18n, loadLocale, getLang, t } from "/assets/js/i18n.js";
    import {
      auth, googleProvider, signInWithPopup, signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
    } from "/assets/js/firebase-config.js";
    import { redirectIfSignedIn } from "/assets/js/auth-guard.js";

    await initI18n();
    redirectIfSignedIn();

    document.getElementById("langToggle").addEventListener("click", async () => {
      const next = getLang() === "ar" ? "en" : "ar";
      await loadLocale(next);
      document.getElementById("langToggle").textContent = next === "ar" ? "EN" : "AR";
    });

    let mode = "signin";
    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.addEventListener("click", () => {
        mode = btn.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("selected", b === btn));
        document.getElementById("submitLabel").textContent = t(mode === "signin" ? "login.signin" : "login.signup");
      });
    });

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg || t("login.error");
      el.style.display = "block";
    }

    document.getElementById("googleBtn").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, googleProvider);
        window.location.href = "/onboarding.html";
      } catch (err) {
        if (err?.code === "auth/popup-closed-by-user" || err?.code === "auth/cancelled-popup-request") {
          return; // user just closed the popup, not a real error
        }
        console.error("Google sign-in failed:", err.code, err.message);
        showError(`${t("login.error")} (${err?.code || "unknown"})`);
      }
    });

    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      try {
        if (mode === "signin") {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        window.location.href = "/onboarding.html";
      } catch (err) {
        console.error("Email auth failed:", err.code, err.message);
        showError(`${t("login.error")} (${err?.code || "unknown"})`);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
