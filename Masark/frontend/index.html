<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/assets/js/device-boot.js"></script>
<title>مسارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/animations.css">
<style>
  body { background: var(--gradient-hero); }
  .howto-shell { min-height: 100dvh; display: flex; flex-direction: column; padding: var(--sp-5) var(--sp-4); padding-top: calc(var(--sp-6) + var(--safe-top)); }
  .howto-top { display: flex; justify-content: space-between; align-items: center; }
  .howto-slides { flex: 1; display: flex; align-items: center; }
  .howto-slide { display: none; text-align: center; max-width: 460px; margin-inline: auto; }
  .howto-slide.active { display: block; animation: fade-in 420ms var(--ease-out) both; }
  .howto-icon { width: 88px; height: 88px; margin: 0 auto var(--sp-5); border-radius: var(--radius-lg); background: var(--bg-card); display: grid; place-items: center; box-shadow: var(--shadow-md); }
  .howto-icon svg { width: 42px; height: 42px; stroke: var(--accent-strong); fill: none; stroke-width: 1.6; }
  .howto-bottom { display: flex; flex-direction: column; gap: var(--sp-4); align-items: center; padding-bottom: var(--sp-5); }
</style>
</head>
<body>
  <div class="howto-shell">
    <div class="howto-top">
      <span class="wordmark">مسارك</span>
      <button class="btn btn-ghost btn-sm" id="skipBtn" data-i18n="howto.skip"></button>
    </div>

    <div class="howto-slides">
      <div class="howto-slide active" data-slide="0">
        <div class="howto-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div>
        <h1 data-i18n="howto.s1.title"></h1>
        <p class="text-muted" style="margin-top:12px" data-i18n="howto.s1.body"></p>
      </div>
      <div class="howto-slide" data-slide="1">
        <div class="howto-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
        <h1 data-i18n="howto.s2.title"></h1>
        <p class="text-muted" style="margin-top:12px" data-i18n="howto.s2.body"></p>
      </div>
      <div class="howto-slide" data-slide="2">
        <div class="howto-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 2v4M16 2v4M4 10h16M8 14h4"/></svg></div>
        <h1 data-i18n="howto.s3.title"></h1>
        <p class="text-muted" style="margin-top:12px" data-i18n="howto.s3.body"></p>
      </div>
      <div class="howto-slide" data-slide="3">
        <div class="howto-icon"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z"/></svg></div>
        <h1 data-i18n="howto.s4.title"></h1>
        <p class="text-muted" style="margin-top:12px" data-i18n="howto.s4.body"></p>
      </div>
    </div>

    <div class="howto-bottom">
      <div class="step-dots" id="stepDots"></div>
      <button class="btn btn-primary btn-block" id="nextBtn" style="max-width:340px" data-i18n="onboarding.continue"></button>
    </div>
  </div>

  <script type="module">
    import { initI18n } from "/assets/js/i18n.js";
    await initI18n();

    const slides = [...document.querySelectorAll(".howto-slide")];
    const dotsEl = document.getElementById("stepDots");
    let current = 0;

    dotsEl.innerHTML = slides.map((_, i) => `<span class="step-dot ${i === 0 ? "active" : ""}"></span>`).join("");

    function render() {
      slides.forEach((s, i) => s.classList.toggle("active", i === current));
      [...dotsEl.children].forEach((d, i) => d.classList.toggle("active", i === current));
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (current < slides.length - 1) {
        current += 1;
        render();
      } else {
        window.location.href = "/login.html";
      }
    });
    document.getElementById("skipBtn").addEventListener("click", () => {
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
